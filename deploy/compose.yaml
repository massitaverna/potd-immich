name: potd-immich

services:
  potd-immich:
    container_name: potd_immich
    image: ghcr.io/massitaverna/potd-immich:${POTD_VERSION:-latest}
    command: daemon
    env_file: .env
    environment:
      # Container-side paths: they must match the secret and volume targets below.
      POTD_API_KEY_FILE: /run/secrets/immich_api_key
      POTD_STATE_FILE: /var/lib/potd-immich/state.json
      POTD_BLOCKLIST_FILE: /var/lib/potd-immich/blocklist.yaml
    secrets:
      - immich_api_key
    volumes:
      - ${DATA_LOCATION:?set DATA_LOCATION in .env}:/var/lib/potd-immich
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

secrets:
  immich_api_key:
    file: ${API_KEY_LOCATION:?set API_KEY_LOCATION in .env}
